name: Publish (npm + PyPI)

# Публикация запускается только по repository_dispatch из GitVerse
# (основной репозиторий) после успешных тестов и синхронизации манифестов。
# npm и PyPI поддерживают OIDC-публикацию только через GitHub Actions,
# поэтому обе публикации живут здесь, без долгоживущих токенов。

# Версия в манифестах уже проставлена в .gitverse (sync_version.py коммитит
# манифесты в тег перед отправкой dispatch), поэтому здесь sync_version не нужен。

# Все публикации выполняются в одном контейнере (одна джоба publish)。

# Ветки и теги в этот репозиторий-зеркало синхронизирует mirror.yml из GitVerse
# (см. .gitverse/workflows/mirror.yml)。Прямой push тега сюда НЕ запускает
# публикацию — только repository_dispatch, чтобы исключить двойную публикацию。

on:
  repository_dispatch:
    types: [publish]

permissions:
  contents: read

jobs:
  publish:
    name: Publish (npm + PyPI)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC для npm provenance, PyPI Trusted Publisher и npm OIDC publishing
      contents: read
    steps:
      # Имя тега приходит в payload repository_dispatch из GitVerse。
      - name: Resolve tag name
        id: tag
        env:
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          TAG="$PAYLOAD_TAG"
          case "$TAG" in
            v*) ;;
            *) echo "Некорректный тег: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Публикация по тегу: $TAG"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # registry-url НЕ указываем: он создаёт .npmrc с _authToken=${NODE_AUTH_TOKEN},
      # а пустой токен перебивает OIDC-аутентификацию npm publish.
      # npm OIDC publishing сам получает токен из окружения GitHub Actions.
      - name: Setup Node.js 24 (npm provenance requires Node >= 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build core (imager-client)
        run: npm run build

      - name: Publish core to npm (OIDC publishing + provenance, no token)
        run: npm publish --provenance --access public

      - name: Publish @pkg-ru/imager-react to npm
        run: |
          cd packages/react
          npm ci
          npm run build
          npm publish --provenance --access public

      - name: Publish @pkg-ru/imager-vue to npm
        run: |
          cd packages/vue
          npm ci
          npm run build
          npm publish --provenance --access public

      - name: Install build tools (PyPI)
        run: python -m pip install --upgrade build twine

      # README для PyPI (doc/PY-RU.md) должен попасть в wheel:
      # копируем его внутрь пакета imager как README.md
      # (подключено как package-data в pyproject.toml)
      - name: Copy README into package
        run: |
          cp doc/PY-RU.md src/imager/README.md

      # Собираем в отдельную папку dist-python: dist/ уже занята npm-сборкой
      # (dist/imager, dist/imager-server), и twine check падал бы на этих
      # директориях с "Unknown distribution format".
      - name: Build distribution
        run: python -m build --outdir dist-python

      - name: Check distribution
        run: python -m twine check dist-python/*

      - name: Publish to PyPI (OIDC Trusted Publisher, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
