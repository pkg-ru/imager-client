[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imager_client"
version = "2.0.3"
description = "Клиент микросервиса Imager: построение путей/URL ассетов и админ-методы"
readme = "doc/PY-RU.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Altuhov Vladislav", email = "33ugla@mail.ru"},
]
keywords = ["imager", "assets", "image", "webp", "avif", "heif", "heic", "jpg", "png", "gif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://gitverse.ru/pkg-ru/imager"
Repository = "https://gitverse.ru/pkg-ru/imager-client"
Mirror = "https://github.com/pkg-ru/imager-client"

[tool.setuptools]
packages = ["imager"]

[tool.setuptools.package-dir]
imager = "src/imager"

# README.md копируется из doc/PY-RU.md в src/imager/README.md на этапе
# сборки (шаг в CI), чтобы попасть в wheel как package-data.
[tool.setuptools.package-data]
imager = ["README.md"]
