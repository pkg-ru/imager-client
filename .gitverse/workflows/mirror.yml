name: Mirror to GitHub

# Зеркалирование GitVerse (основной репозиторий) в GitHub (зеркало).
# Все ветки и теги синхронизируются в github.com/pkg-ru/imager-client по PAT.
# Публикация npm/PyPI выполняется в GitHub по repository_dispatch из publish.yml,
# поэтому mirror.yml НЕ отправляет dispatch — только синхронизирует refs.

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    name: Push refs to GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Клонируем ВСЕ ветки и теги, чтобы push +refs/heads/* покрыл
          # каждую ветку, а не только текущую (default checkout берёт одну)。
          fetch-all: true

      # Синхронизируем только ветки и теги (без refs/remotes и прочего мусора):
      # +refs/heads/* — force-push всех веток, +refs/tags/* — force-push всех тегов,
      # --prune удаляет в GitHub ветки/теги, которых больше нет в GitVerse.
      # Force-push тега из publish.yml (после sync_version) тоже попадёт сюда —
      # это безопасно, т.к. GitHub-воркфлоу публикует только по repository_dispatch.
      - name: Push branches and tags to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote add mirror "https://x-access-token:${GH_PAT}@github.com/pkg-ru/imager-client.git"
          git push --prune mirror "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
